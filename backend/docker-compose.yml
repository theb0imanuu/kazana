services:
  postgres:
    image: postgres:16-alpine
    container_name: kazana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kazana
      POSTGRES_PASSWORD: kazana_password
      POSTGRES_DB: kazana
    ports:
      - "5432:5432"
    volumes:
      - kazana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazana -d kazana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kazana-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kazana_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kazana-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kazana:kazana_password@postgres:5432/kazana?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  kazana_postgres_data:
  kazana_redis_data: