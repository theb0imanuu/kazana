name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kazana
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # =========================================================================
      # BACKEND
      # =========================================================================
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Prisma Migrations & Generate Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/kazana?schema=public"
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run Backend Unit Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/kazana?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-change-me
          JWT_EXPIRES_IN: "1d"
        run: npm test

      - name: Run Backend E2E Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/kazana?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-change-me
          JWT_EXPIRES_IN: "1d"
        run: npm run test:e2e

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      # =========================================================================
      # FRONTEND
      # =========================================================================
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: "https://kazana-api-b2hjfdapcgbydwam.canadacentral-01.azurewebsites.net"
        run: |
          npm run build -- --base=/kazana/
          cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      # =========================================================================
      # CONTAINERS
      # =========================================================================
      - name: Build Docker Container Images
        run: |
          docker build -t kazana-backend:latest ./backend
          docker build -t kazana-frontend:latest ./frontend

  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
